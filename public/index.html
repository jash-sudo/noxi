<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>jash — noxi</title>
  <style>
    :root{
      --text:#fff;--muted:#8a8a8a;--line:rgba(255,255,255,.13);--panel:rgba(0,0,0,.48);
      --accent:#fff;--blur:16px;--radius:18px;--card-width:620px;--cursor-size:18px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
    a{color:inherit;text-decoration:none}.bg{position:fixed;inset:0;z-index:-4;background:#000;overflow:hidden}.bg video,.bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
    .shade{position:fixed;inset:0;z-index:-3;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.52))}.grain{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
    #fx{position:fixed;inset:0;z-index:-1;pointer-events:none}.wrap{min-height:100vh;padding:10vh 20px 12vh;display:flex;flex-direction:column;align-items:center}.profile{width:min(var(--card-width),94vw);display:flex;flex-direction:column;gap:14px}
    .enter{position:fixed;inset:0;z-index:99;background:#000;display:grid;place-items:center;transition:.45s ease}.enter.hidden{opacity:0;pointer-events:none}.enter button{background:none;border:1px solid #2a2a2a;color:#fff;padding:13px 20px;font:inherit;letter-spacing:.13em;cursor:pointer}.enter button:hover{border-color:#777}
    .hero{text-align:center;padding:24px 18px}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}h1{font-size:32px;font-weight:500;letter-spacing:.02em;margin:18px 0 7px}.bio{margin:0;color:#c7c7c7;line-height:1.6}.handle{color:var(--muted);font-size:12px;margin-top:8px}
    .marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;white-space:nowrap}.marquee-track{display:inline-flex;gap:42px;min-width:max-content;animation:marquee 18s linear infinite;color:#bdbdbd;font-size:12px;letter-spacing:.08em;text-transform:uppercase}@keyframes marquee{to{transform:translateX(-50%)}}
    .box,.link{background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:var(--radius)}.box{padding:18px}.box h2{font-size:13px;font-weight:500;margin:0 0 10px;color:#ddd}.box p{margin:0;color:#aaa;line-height:1.65;font-size:13px}.links{display:grid;gap:10px}.link{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;transition:.18s ease;transform-style:preserve-3d}.link:hover{border-color:#555;transform:translateY(-2px)}.link small{color:#777}
    .socials{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;padding:8px 0 2px;font-size:12px;color:#aaa}.socials a:hover{color:#fff}.music-row{display:flex;align-items:center;gap:12px}.music-row button{border:1px solid var(--line);background:#050505;color:#fff;padding:9px 12px;border-radius:999px;cursor:pointer}.music-row span{font-size:12px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .reveal{opacity:0;transform:translateY(18px);transition:.6s ease}.reveal.show{opacity:1;transform:none}.cursor{position:fixed;width:var(--cursor-size);height:var(--cursor-size);border:1px solid #fff;border-radius:50%;pointer-events:none;z-index:120;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .15s,height .15s,opacity .2s}.cursor.big{width:38px;height:38px}
    footer{margin-top:20px;text-align:center;color:#555;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
    @media(max-width:650px){.wrap{padding-top:7vh}.avatar{width:92px;height:92px}h1{font-size:27px}.cursor{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.marquee-track{animation:none}.reveal{opacity:1;transform:none;transition:none}}
  </style>
</head>
<body>
  <div class="bg"><video id="bgVideo" autoplay muted loop playsinline></video><img id="bgImage" alt="" hidden></div>
  <div class="shade"></div><div class="grain"></div><canvas id="fx"></canvas><div class="cursor" id="cursor"></div>
  <div class="enter" id="enter"><button id="enterBtn" type="button">enter</button></div>

  <main class="wrap">
    <section class="profile">
      <div class="hero reveal">
        <img class="avatar" id="avatar" alt="profile picture">
        <h1 id="name">jash</h1>
        <p class="bio" id="bio"></p>
        <div class="handle" id="handle"></div>
      </div>

      <div class="marquee reveal"><div class="marquee-track" id="marquee"></div></div>
      <div id="boxes"></div>
      <div class="links reveal" id="links"></div>
      <div class="box reveal music-row"><button id="musicBtn" type="button">play</button><span id="trackLabel">music</span></div>
      <div class="socials reveal" id="socials"></div>
      <footer>noxi.lol</footer>
    </section>
  </main>

  <audio id="music" loop preload="none"></audio>

  <script>
    // ===== EASY CUSTOMIZATION =====
    // Change only this object. Leave the rest of the file alone.
    const PROFILE = {
      name: 'jash',
      handle: '@jash',
      bio: 'just a little corner of the internet.',
      avatar: 'https://placehold.co/300x300/0a0a0a/ffffff?text=J',

      // Use either an MP4/WebM URL OR an image URL.
      backgroundVideo: '',
      backgroundImage: '',

      // Direct audio file URL: mp3/ogg/wav. Browser requires a click before playing.
      music: '',
      musicLabel: 'music',

      scrollingText: ['jash','noxi.lol','coding','minecraft','web stuff','jash'],

      boxes: [
        { title: 'about', text: 'coding, games, random projects, and whatever else i feel like putting here.' },
        { title: 'status', text: 'probably building something.' }
      ],

      links: [
        { title: 'github', sub: 'projects', url: 'https://github.com/jash-sudo' },
        { title: 'youtube', sub: 'videos', url: '#' },
        { title: 'discord', sub: 'social', url: '#' }
      ],

      socials: [
        { label: 'github', url: 'https://github.com/jash-sudo' }
      ],

      style: {
        accent: '#ffffff', text: '#ffffff', panel: 'rgba(0,0,0,.48)',
        blur: 16, radius: 18, cardWidth: 620
      },

      effects: {
        particles: true,
        cursor: true,
        cursorTrail: true,
        tiltLinks: true,
        scrollReveal: true
      }
    };

    const $ = s => document.querySelector(s);
    const root = document.documentElement;
    root.style.setProperty('--accent', PROFILE.style.accent);
    root.style.setProperty('--text', PROFILE.style.text);
    root.style.setProperty('--panel', PROFILE.style.panel);
    root.style.setProperty('--blur', PROFILE.style.blur + 'px');
    root.style.setProperty('--radius', PROFILE.style.radius + 'px');
    root.style.setProperty('--card-width', PROFILE.style.cardWidth + 'px');

    $('#name').textContent = PROFILE.name;
    $('#handle').textContent = PROFILE.handle;
    $('#bio').textContent = PROFILE.bio;
    $('#avatar').src = PROFILE.avatar;
    $('#music').src = PROFILE.music;
    $('#trackLabel').textContent = PROFILE.musicLabel;

    if (PROFILE.backgroundVideo) {
      $('#bgVideo').src = PROFILE.backgroundVideo;
    } else {
      $('#bgVideo').hidden = true;
      if (PROFILE.backgroundImage) { $('#bgImage').src = PROFILE.backgroundImage; $('#bgImage').hidden = false; }
    }

    const scrollItems = [...PROFILE.scrollingText, ...PROFILE.scrollingText];
    $('#marquee').innerHTML = scrollItems.map(x => `<span>${escapeHtml(x)}</span>`).join('');
    $('#boxes').innerHTML = PROFILE.boxes.map(x => `<section class="box reveal"><h2>${escapeHtml(x.title)}</h2><p>${escapeHtml(x.text)}</p></section>`).join('');
    $('#links').innerHTML = PROFILE.links.map(x => `<a class="link" href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer"><span>${escapeHtml(x.title)}</span><small>${escapeHtml(x.sub || 'open')} ↗</small></a>`).join('');
    $('#socials').innerHTML = PROFILE.socials.map(x => `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(x.label)}</a>`).join('');

    function escapeHtml(s){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function safeUrl(u){ try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:'#';}catch{return '#';} }

    const music = $('#music');
    const musicBtn = $('#musicBtn');
    let playing = false;
    async function toggleMusic(){
      if(!PROFILE.music){ musicBtn.textContent='no music'; return; }
      try{ if(playing){music.pause();playing=false;musicBtn.textContent='play';}else{await music.play();playing=true;musicBtn.textContent='pause';} }catch{musicBtn.textContent='tap again';}
    }
    musicBtn.addEventListener('click', toggleMusic);
    $('#enterBtn').addEventListener('click', async()=>{ $('#enter').classList.add('hidden'); if(PROFILE.music) await toggleMusic(); });

    if (PROFILE.effects.scrollReveal && 'IntersectionObserver' in window) {
      const io = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.08});
      document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    } else document.querySelectorAll('.reveal').forEach(el=>el.classList.add('show'));

    const cursor = $('#cursor');
    if (!PROFILE.effects.cursor) cursor.style.display='none';
    document.addEventListener('pointermove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
    document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('pointerenter',()=>cursor.classList.add('big'));el.addEventListener('pointerleave',()=>cursor.classList.remove('big'))});

    if(PROFILE.effects.tiltLinks){
      document.querySelectorAll('.link').forEach(el=>{
        el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(700px) rotateX(${y*-4}deg) rotateY(${x*5}deg) translateY(-2px)`});
        el.addEventListener('pointerleave',()=>el.style.transform='');
      });
    }

    const canvas=$('#fx'),ctx=canvas.getContext('2d'); let dots=[]; let raf=0;
    function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
    resize(); addEventListener('resize',resize);
    if(PROFILE.effects.particles && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      dots=Array.from({length:Math.min(70,Math.max(26,Math.floor(innerWidth/24)))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2+.3,v:Math.random()*.25+.08,a:Math.random()*.35+.08}));
      const draw=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#fff';for(const d of dots){d.y-=d.v;if(d.y<0){d.y=innerHeight;d.x=Math.random()*innerWidth}ctx.globalAlpha=d.a;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;raf=requestAnimationFrame(draw)}; draw();
    }
  </script>
</body>
</html>
