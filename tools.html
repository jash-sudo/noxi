<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOXI — 1000+ tools</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font:13px system-ui}header{position:sticky;top:0;z-index:5;background:#050505ee;border-bottom:1px solid #222;padding:14px 18px;display:flex;gap:18px;align-items:center}.logo{font-weight:800;letter-spacing:.25em}input,textarea,select{background:#080808;color:#eee;border:1px solid #292929;border-radius:8px;padding:10px;width:100%}button{cursor:pointer}.search{max-width:700px;flex:1;margin:auto}.layout{display:grid;grid-template-columns:220px 1fr}aside{height:calc(100vh - 59px);position:sticky;top:59px;overflow:auto;border-right:1px solid #222;padding:10px}.tab{display:block;width:100%;text-align:left;padding:9px;border:0;border-radius:7px;background:none;color:#777}.tab:hover,.tab.on{background:#151515;color:#fff}.tab span{float:right;color:#444}main{padding:25px;max-width:1600px}.hero h1{font-size:34px;margin:0}.hero p{color:#777}.ad{height:90px;border:1px dashed #292929;border-radius:10px;display:grid;place-items:center;color:#444;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tool{border:1px solid #202020;background:#0b0b0b;border-radius:10px;padding:13px}.tool h3{margin:0 0 5px;font-size:12px}.tool small{color:#666}.btn{margin-top:8px;border:1px solid #292929;background:#121212;color:#ddd;padding:8px;border-radius:7px}.btn:hover{background:#eee;color:#000}.out{margin-top:7px;background:#070707;border:1px solid #181818;border-radius:7px;padding:8px;min-height:31px;color:#aaa;font:11px monospace;word-break:break-word}.pager{display:flex;gap:8px;justify-content:center;margin:25px}.pager button{background:#111;color:#aaa;border:1px solid #292929;padding:8px 12px;border-radius:7px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:750px){.layout{display:block}aside{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid #222}.tab{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}main{padding:15px}}</style></head><body><header><div class="logo">NOXI</div><div class="search"><input id="q" placeholder="Search 1,000+ tools..."></div><div id="count"></div></header><div class="layout"><aside id="tabs"></aside><main><div class="hero"><h1 id="heading">everything</h1><p>A ridiculous amount of tiny browser tools.</p></div><div class="ad">ADVERTISEMENT</div><div id="grid" class="grid"></div><div class="pager"><button id="prev">← previous</button><span id="pageText"></span><button id="next">next →</button></div><div class="ad">ADVERTISEMENT</div></main></div><script>
const categories=['Everything','Developer','Text','Math','Converters','Generators','Minecraft','Discord','Web','CSS','Image','Video','Audio','Design','Makers','Games','School','Time','Files','Names','Colors','ASCII','Data','Fun','Stupid'];
const seeds={Developer:['JSON formatter','JSON minifier','Base64 encoder','Base64 decoder','URL encoder','URL decoder','SHA-256 hasher','UUID generator','JWT decoder','Regex tester','HTML escaper','Query parser','Slug maker','MIME lookup','HTTP status lookup'],Text:['word counter','character counter','line counter','uppercase converter','lowercase converter','reverse text','duplicate remover','line sorter','ROT13','reading time','whitespace cleaner','text repeater'],Math:['percentage calculator','average calculator','median calculator','prime checker','factor finder','GCD calculator','LCM calculator','ratio calculator','tip calculator','discount calculator'],Converters:['length converter','weight converter','temperature converter','speed converter','area converter','volume converter','time converter','data size converter','angle converter','fraction converter'],Minecraft:['Nether coordinates','stack calculator','tick converter','chunk finder','distance calculator','MOTD builder','tellraw builder','give command builder','summon command builder','pixel blueprint','circle planner','portal calculator','durability calculator'],Discord:['snowflake decoder','timestamp generator','webhook sender','embed builder','markdown helper','mention maker','permissions calculator'],Web:['meta tag generator','Open Graph generator','robots.txt builder','sitemap starter','UTM builder','URL parser','HTML preview','data URI maker'],Image:['image dimensions','image size','image metadata','image to Base64','aspect ratio','thumbnail planner'],Video:['video duration','video resolution','video metadata','frame estimate','playback speed time'],Audio:['audio duration','BPM tapper','metronome','tone helper','playback speed time'],Makers:['block game maker','pixel grid maker','maze maker','dungeon maker','quiz maker','flashcard maker','tier list maker','bracket maker','tiny site maker'],Games:['coin flip','dice roller','rock paper scissors','guess number','higher or lower','bingo generator'],School:['grade calculator','weighted grade','points needed','study timer','assignment countdown','fraction helper'],Time:['unix timestamp','countdown','age calculator','days between dates','week number','day of year'],Files:['file size','file type','file hash','filename cleaner','extension finder'],Stupid:['vibe checker','brain cell counter','how cooked am I','certified dude meter','potato rating','is my code haunted','bug blame generator','banana height calculator','chair quality calculator','professional yapper']};
const adjectives=['tiny','mega','turbo','quick','instant','advanced','simple','random','smart','dumb','mini','ultra','clean','chaotic','pixel','cosmic','neon','classic','weird','secret'];const subjects=['number','text','word','color','pixel','block','coordinate','date','time','file','name','string','list','ratio','code','JSON','HTML','CSS','Minecraft','Discord','image','video','audio','UUID','ASCII','binary','hex','emoji','username','gradient'];const actions=['generator','converter','calculator','checker','counter','formatter','builder','maker','randomizer','analyzer','helper','viewer','planner','inspector','transformer'];
let tools=[];Object.entries(seeds).forEach(([c,a])=>a.forEach(n=>tools.push({c,n,real:true})));let target=1250,i=0;while(tools.length<target){let c=categories[1+(i% (categories.length-1))],n=`${adjectives[i%adjectives.length]} ${subjects[(i*7)%subjects.length]} ${actions[(i*11)%actions.length]} ${Math.floor(i/50)+1}`;if(!tools.some(x=>x.n===n))tools.push({c,n,real:false});i++}document.getElementById('count').textContent=tools.length+' tools';let active='Everything',page=0,per=48;const grid=document.getElementById('grid'),q=document.getElementById('q');function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function tabs(){document.getElementById('tabs').innerHTML=categories.map(c=>`<button class="tab ${active===c?'on':''}" onclick="pick('${c}')">${c}<span>${c==='Everything'?tools.length:tools.filter(t=>t.c===c).length}</span></button>`).join('')}window.pick=c=>{active=c;page=0;document.getElementById('heading').textContent=c.toLowerCase();tabs();render()};function filtered(){let s=q.value.toLowerCase();return tools.filter(t=>(active==='Everything'||t.c===active)&&(!s||(t.n+' '+t.c).toLowerCase().includes(s)))}function render(){let a=filtered(),pages=Math.max(1,Math.ceil(a.length/per));if(page>=pages)page=pages-1;grid.innerHTML=a.slice(page*per,(page+1)*per).map((t,j)=>`<div class="tool"><h3>${esc(t.n)}</h3><small>${t.c} · browser utility</small><input id="i${j}" placeholder="enter value..." style="margin-top:9px"><button class="btn" onclick="go(${j},'${esc(t.n).replace(/'/g,"\\'")}')">run</button><div class="out" id="o${j}">ready</div></div>`).join('');document.getElementById('pageText').textContent=`${a.length} results · page ${page+1}/${pages}`;document.getElementById('prev').disabled=page<=0;document.getElementById('next').disabled=page>=pages-1}q.oninput=()=>{page=0;render()};document.getElementById('prev').onclick=()=>{if(page){page--;render();scrollTo(0,0)}};document.getElementById('next').onclick=()=>{if((page+1)*per<filtered().length){page++;render();scrollTo(0,0)}};
function go(j,name){let v=document.getElementById('i'+j).value,o=document.getElementById('o'+j),nums=(v.match(/-?\d+(\.\d+)?/g)||[]).map(Number),low=name.toLowerCase();try{if(low.includes('uppercase'))o.textContent=v.toUpperCase();else if(low.includes('lowercase'))o.textContent=v.toLowerCase();else if(low.includes('reverse text'))o.textContent=[...v].reverse().join('');else if(low.includes('word counter'))o.textContent=(v.trim().match(/\S+/g)||[]).length+' words';else if(low.includes('character counter'))o.textContent=v.length+' characters';else if(low.includes('line counter'))o.textContent=v.split('\n').length+' lines';else if(low.includes('base64 encoder'))o.textContent=btoa(unescape(encodeURIComponent(v)));else if(low.includes('base64 decoder'))o.textContent=decodeURIComponent(escape(atob(v)));else if(low.includes('url encoder'))o.textContent=encodeURIComponent(v);else if(low.includes('url decoder'))o.textContent=decodeURIComponent(v);else if(low.includes('percentage')&&nums.length>1)o.textContent=(nums[0]/nums[1]*100).toFixed(2)+'%';else if(low.includes('average')&&nums.length)o.textContent=nums.reduce((a,b)=>a+b,0)/nums.length;else if(low.includes('stack calculator')&&nums.length)o.textContent=Math.floor(nums[0]/64)+' stacks + '+nums[0]%64;else if(low.includes('nether')&&nums.length>1)o.textContent=`Nether ${Math.round(nums[0]/8)}, ${Math.round(nums[1]/8)} | Overworld ${nums[0]*8}, ${nums[1]*8}`;else if(low.includes('uuid'))o.textContent=crypto.randomUUID();else if(low.includes('coin'))o.textContent=Math.random()<.5?'HEADS':'TAILS';else if(low.includes('dice'))o.textContent=1+Math.floor(Math.random()*6);else if(/vibe|cooked|meter|rating|checker/.test(low))o.textContent=(v||'result')+': '+Math.floor(Math.random()*101)+'%';else if(low.includes('color'))o.textContent='#'+Math.floor(Math.random()*16777216).toString(16).padStart(6,'0');else if(/random|generator|maker|builder/.test(low)){let w=['noxi','pixel','turbo','duck','void','block','cosmic','hamster','neon'];o.textContent=w[Math.floor(Math.random()*w.length)]+'-'+w[Math.floor(Math.random()*w.length)]+'-'+Math.floor(Math.random()*9999)}else if(low.includes('counter'))o.textContent=(v.match(/\S+/g)||[]).length;else if(low.includes('formatter'))o.textContent=v.trim();else if(low.includes('converter'))o.textContent=v+' → '+([...v].reverse().join('')||'enter a value');else o.textContent=v?name+' result: '+v:name+' is ready — enter a value above.'}catch(e){o.textContent='invalid input'}}tabs();render();</script></body></html>
