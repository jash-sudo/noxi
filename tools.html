<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOXI — internet toolbox</title><meta name="description" content="A giant collection of free browser tools, generators, converters, mini makers and useless buttons."><style>:root{--bg:#050505;--side:#080808;--card:#0c0c0c;--line:#202020;--text:#f3f3f3;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{height:58px;position:sticky;top:0;z-index:20;background:#050505e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px}.logo{font-weight:800;letter-spacing:.25em}.search{flex:1;max-width:620px;margin:auto}input,textarea,select{width:100%;background:#070707;color:#eee;border:1px solid #252525;border-radius:8px;padding:10px;outline:none}textarea{min-height:90px;resize:vertical}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 58px)}aside{position:sticky;top:58px;height:calc(100vh - 58px);border-right:1px solid var(--line);padding:15px 10px;overflow:auto;background:var(--side)}.tab{display:block;width:100%;text-align:left;border:0;background:transparent;color:#777;padding:9px 11px;border-radius:7px;margin:1px 0}.tab:hover,.tab.on{background:#151515;color:#fff}.count{float:right;color:#444}main{padding:28px;width:min(1500px,100%)}.top h1{font-size:32px;margin:0 0 6px;letter-spacing:-.04em}.top p{margin:0;color:#777}.ad{height:90px;border:1px dashed #2a2a2a;border-radius:10px;margin:22px 0;display:grid;place-items:center;color:#444;font-size:10px;letter-spacing:.14em}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.tool{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;min-width:0}.tool:hover{border-color:#343434}.tool h3{font-size:13px;margin:0 0 4px}.tool p{font-size:10px;color:#666;margin:0 0 11px;line-height:1.45}.btn{background:#111;color:#ddd;border:1px solid #2b2b2b;border-radius:7px;padding:8px 10px;margin-top:7px}.btn:hover{background:#eee;color:#050505}.row{display:flex;gap:6px}.out{white-space:pre-wrap;word-break:break-word;background:#070707;border:1px solid #191919;border-radius:7px;padding:8px;margin-top:7px;min-height:32px;color:#bbb;font:11px ui-monospace,monospace}.hide{display:none}.badge{font-size:9px;color:#555;margin-left:auto}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:8px}.tab{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:18px}.badge{display:none}}</style></head><body><header><div class="logo">NOXI</div><div class="search"><input id="q" placeholder="Search the toolbox... (calculator, minecraft, stupid, maker, text...)" autofocus></div><div class="badge" id="total"></div></header><div class="layout"><aside id="tabs"></aside><main><div class="top"><h1 id="title">everything</h1><p id="subtitle">Useful tools, weird tools, generators, mini makers, and things nobody asked for.</p></div><div class="ad">ADVERTISEMENT</div><div class="grid" id="grid"></div><div class="ad">ADVERTISEMENT</div></main></div><script>

let tools=[];Object.entries(defs).forEach(([c,names])=>names.forEach(n=>tools.push({c,n})));let active='Everything';
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),q=document.getElementById('q');document.getElementById('total').textContent=tools.length+' tools';
function tabRender(){tabs.innerHTML=cats.map(c=>`<button class="tab ${c===active?'on':''}" data-c="${c}">${c}<span class="count">${c==='Everything'?tools.length:tools.filter(x=>x.c===c).length}</span></button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.c;document.getElementById('title').textContent=active.toLowerCase();tabRender();render()})}
const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function body(t,i){let n=t.n,id='t'+i;if(/Image|Video|Audio|File/.test(n)&&!/(Size|Aspect|Percentage|Time|Timestamp|Notes|Name|Bytes)/.test(n))return `<input id="${id}" type="file"><div class="out" id="${id}o">Choose a local file. Nothing uploads.</div>`;if(n==='Block Game Maker')return `<div class="row"><input id="${id}w" type="number" value="12" min="4" max="40"><input id="${id}h" type="number" value="8" min="4" max="30"></div><button class="btn" onclick="blockGame('${id}')">make grid</button><div class="out" id="${id}o">Create a clickable block map.</div>`;if(/Generator|Picker|Random|Flip|Dice|Fortune|Vibe|Luck|Cooked|Meter|Excuse|Yapper|Haunted|Blame|Tuesday|Button|Honk|Quote|Chickens|Potato|Sandwich|Brain Cell|Grass|NPC|Name This/.test(n))return `<input id="${id}" placeholder="optional input"><button class="btn" onclick="randomTool('${id}','${esc(n)}')">generate</button><div class="out" id="${id}o"></div>`;return `<textarea id="${id}" placeholder="Enter value or text..."></textarea><button class="btn" onclick="run('${id}','${esc(n)}')">run</button><div class="out" id="${id}o"></div>`}
function render(){let s=q.value.toLowerCase().trim(),arr=tools.filter(t=>(active==='Everything'||t.c===active)&&(!s||(t.n+' '+t.c).toLowerCase().includes(s)));grid.innerHTML=arr.map(t=>{let i=tools.indexOf(t);return `<article class="tool"><h3>${esc(t.n)}</h3><p>${esc(t.c)} utility · runs in your browser where possible</p>${body(t,i)}</article>`}).join('')||'<div class="out">No tools found.</div>';grid.querySelectorAll('input[type=file]').forEach(el=>el.onchange=()=>{let f=el.files[0],o=document.getElementById(el.id+'o');if(f)o.textContent=`${f.name}\n${f.type||'unknown type'}\n${formatBytes(f.size)}\nlast modified ${new Date(f.lastModified).toLocaleString()}`})}
q.oninput=render;function formatBytes(n){let u=['B','KB','MB','GB'],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?2:0)+' '+u[i]}
function run(id,name){let v=document.getElementById(id).value,o=document.getElementById(id+'o'),nums=(v.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);try{if(name==='Uppercase')o.textContent=v.toUpperCase();else if(name==='Lowercase')o.textContent=v.toLowerCase();else if(name==='Reverse Text')o.textContent=[...v].reverse().join('');else if(name==='Word Counter')o.textContent=(v.trim().match(/\S+/g)||[]).length+' words';else if(name==='Character Counter')o.textContent=v.length+' characters';else if(name==='Line Counter')o.textContent=v.split('\n').length+' lines';else if(name==='Base64 Encoder')o.textContent=btoa(unescape(encodeURIComponent(v)));else if(name==='Base64 Decoder')o.textContent=decodeURIComponent(escape(atob(v)));else if(name==='URL Encoder')o.textContent=encodeURIComponent(v);else if(name==='URL Decoder')o.textContent=decodeURIComponent(v);else if(name.includes('Percentage')&&nums.length>=2)o.textContent=((nums[0]/nums[1])*100).toFixed(2)+'%';else if(name.includes('Average'))o.textContent=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length):'enter numbers';else if(name.includes('Nether'))o.textContent=nums.length>=2?`Nether: ${Math.round(nums[0]/8)}, ${Math.round(nums[1]/8)} | Overworld if input is Nether: ${nums[0]*8}, ${nums[1]*8}`:'enter X and Z';else if(name==='Stack Calculator')o.textContent=nums.length?`${Math.floor(nums[0]/64)} stacks + ${nums[0]%64} items`:'enter item count';else if(name==='Remove Duplicate Lines')o.textContent=[...new Set(v.split('\n'))].join('\n');else if(name==='Sort Lines A-Z')o.textContent=v.split('\n').sort().join('\n');else if(name==='Sort Lines Z-A')o.textContent=v.split('\n').sort().reverse().join('\n');else if(name.includes('Reading Time'))o.textContent=Math.max(1,Math.ceil((v.trim().match(/\S+/g)||[]).length/225))+' min read';else if(name==='ROT13')o.textContent=v.replace(/[a-z]/gi,c=>String.fromCharCode(c.charCodeAt(0)+(c.toLowerCase()<'n'?13:-13)));else if(name.includes('Timestamp')||name.includes('Unix')){let x=Number(v);o.textContent=x?new Date(x*(x<1e12?1000:1)).toString():Math.floor(Date.now()/1000)}else if(name.includes('Aspect Ratio')&&nums.length>=2){let a=nums[0],b=nums[1],g=(x,y)=>y?g(y,x%y):x,d=g(a,b);o.textContent=`${a/d}:${b/d}`}else o.textContent=v?`${name} result:\n${v}`:`${name} ready. Enter something above.`}catch(e){o.textContent='Could not process that input.'}}
const words=['noxi','hamster','pixel','void','duck','block','neon','toast','potato','wizard','turbo','goober','cosmic','tiny','mega','banana','chair','dude','beep'];function randomTool(id,name){let inp=document.getElementById(id).value,o=document.getElementById(id+'o'),r=n=>Math.floor(Math.random()*n),w=()=>words[r(words.length)];if(name==='Coin Flip')o.textContent=Math.random()<.5?'HEADS':'TAILS';else if(name.includes('Dice'))o.textContent=String(1+r(6));else if(name==='Is It Tuesday?')o.textContent=new Date().getDay()===2?'YES. IT IS TUESDAY.':'no';else if(/Percentage|Meter|Checker|Cooked|Rating/.test(name))o.textContent=`${inp||w()}: ${r(101)}%`;else if(name.includes('UUID'))o.textContent=crypto.randomUUID();else if(name.includes('Color'))o.textContent='#'+r(0xffffff+1).toString(16).padStart(6,'0');else if(name.includes('Number'))o.textContent=String(r(1000000));else if(name.includes('Yes')||name.includes('Should'))o.textContent=Math.random()<.5?'YES':'NO';else o.textContent=[w(),w(),w()].join('-')}
function blockGame(id){let w=Math.max(4,Math.min(40,+document.getElementById(id+'w').value||12)),h=Math.max(4,Math.min(30,+document.getElementById(id+'h').value||8)),o=document.getElementById(id+'o');o.innerHTML=`<div style="display:grid;grid-template-columns:repeat(${w},1fr);gap:1px">${Array(w*h).fill(0).map(()=>'<button onclick="this.style.opacity=this.style.opacity==\'0.25\'?1:0.25" style="aspect-ratio:1;background:#aaa;border:0;padding:0"></button>').join('')}</div>`}
tabRender();render();</script></body></html>
