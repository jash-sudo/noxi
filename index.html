<!doctype html>
<html lang="en">
<head>

<title>jash</title>
<style>
:root{--accent:#fff;--text:#fff;--muted:rgba(255,255,255,.72);--box:rgba(8,8,8,.58);--border:rgba(255,255,255,.15);--radius:18px;--blur:16px;--overlay:.42;--glow:20px;--cardWidth:760px;--heroScale:1;--bgZoom:1.03}
*{box-sizing:border-box}html{background:#050505;scroll-behavior:smooth;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}body{margin:0;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}button,input{font:inherit}
.background{position:fixed;inset:0;z-index:-7;overflow:hidden;background:#050505}.background video,.background .bgImage{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover}.background .bgImage{background-size:cover;background-position:center;background-repeat:no-repeat}.background[data-motion="slowzoom"] video,.background[data-motion="slowzoom"] .bgImage{animation:bgZoom 14s ease-in-out infinite alternate}.background[data-motion="drift"] video,.background[data-motion="drift"] .bgImage{animation:bgDrift 18s ease-in-out infinite alternate}.shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.12),rgba(0,0,0,var(--overlay)) 72%,rgba(0,0,0,.62));z-index:-5}.noise{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.sound{position:fixed;left:18px;top:18px;z-index:40;width:42px;height:42px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:17px;transition:.2s}.sound:hover{background:rgba(255,255,255,.12);transform:scale(1.04)}
.snap{min-height:100svh;scroll-snap-align:start;scroll-snap-stop:always}.hero{display:grid;place-items:center;position:relative;padding:90px 24px}.heroCore{text-align:center;max-width:560px;transform:translateY(-1vh) scale(var(--heroScale));text-shadow:0 2px 16px rgba(0,0,0,.8)}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.22);margin:0 auto 12px;display:block;box-shadow:0 0 var(--glow) color-mix(in srgb,var(--accent) 22%,transparent)}.identity{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}.name{font-size:28px;line-height:1;font-weight:600;letter-spacing:-.035em;text-shadow:0 0 var(--glow) color-mix(in srgb,var(--accent) 45%,transparent)}.badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}.badge{display:grid;place-items:center;min-width:21px;height:21px;padding:0 5px;border-radius:999px;font-size:11px;background:var(--badge-bg,rgba(255,255,255,.1));color:var(--badge-color,#fff);border:1px solid var(--badge-border,rgba(255,255,255,.12));backdrop-filter:blur(8px);transition:.2s;transform-origin:center}.badge:hover{transform:translateY(-2px) scale(1.08)}.badge.anim-pulse{animation:badgePulse 2s ease-in-out infinite}.badge.anim-float{animation:badgeFloat 2.4s ease-in-out infinite}.badge.anim-spin{animation:badgeSpin 5s linear infinite}.badge.anim-glow{animation:badgeGlow 2s ease-in-out infinite}.handle{margin-top:8px;font-size:12px;color:rgba(255,255,255,.86)}.bio{margin:5px auto 0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.9);white-space:pre-wrap}.heroLinks{display:flex;justify-content:center;gap:10px;margin-top:14px}.heroLink{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);font-size:13px;transition:.2s ease}.heroLink:hover{transform:translateY(-2px) scale(1.08);background:rgba(255,255,255,.12)}
.meta{position:absolute;left:22px;bottom:20px;font-size:10px;color:rgba(255,255,255,.72);display:flex;gap:8px;align-items:center}.scrollCue{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.86);text-align:center;line-height:1.5;animation:bob 1.8s ease-in-out infinite}.scrollCue b{display:block;font-size:16px;font-weight:400}.dots{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:grid;gap:6px}.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);transition:.25s}.dots i.active{background:#fff;transform:scale(1.2)}.ticker{position:absolute;left:0;right:0;top:0;overflow:hidden;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;background:linear-gradient(to bottom,rgba(0,0,0,.22),transparent)}.ticker span{display:inline-block;padding:8px 0;animation:ticker 20s linear infinite}
.more{padding:90px 18px 110px;background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.72));backdrop-filter:blur(2px);display:flex;align-items:center}.content{width:min(var(--cardWidth),100%);margin:0 auto}.songCard,.box,.link{background:var(--box);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}.songCard{padding:14px;display:grid;grid-template-columns:64px 1fr auto;gap:13px;align-items:center;margin-bottom:14px}.songCover{width:64px;height:64px;object-fit:cover;border-radius:calc(var(--radius)*.65);background:#111}.songTitle{font-size:13px}.songArtist,.songAlbum{font-size:11px;color:var(--muted);margin-top:3px}.songControls{display:flex;align-items:center;gap:8px}.songControls button{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:rgba(0,0,0,.3);color:#fff;cursor:pointer}.volume{width:74px;accent-color:var(--accent)}.waveWrap{grid-column:2/4;display:flex;align-items:center;gap:9px}.wave{height:30px;display:flex;align-items:center;gap:2px;flex:1}.wave i{display:block;flex:1;min-width:2px;max-width:5px;height:20%;border-radius:4px;background:rgba(255,255,255,.65);transform-origin:center}.time{font-size:10px;color:var(--muted);min-width:70px;text-align:right}.stack,.links{display:grid;gap:10px}.box{padding:18px}.box h2{font-size:12px;margin:0 0 8px;font-weight:500}.box p{margin:0;color:#ccc;font-size:12px;line-height:1.6;white-space:pre-wrap}.links{margin-top:10px}.link{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:12px;transition:.2s}.link:after{content:'↗';color:var(--muted)}.link:hover{transform:translateY(-2px);background:rgba(255,255,255,.06)}.footer{text-align:center;font-size:10px;color:#777;margin-top:28px}
#enter{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;transition:opacity .35s}.enterButton{border:1px solid #2a2a2a;background:#050505;color:#fff;padding:12px 20px;font-size:11px;letter-spacing:.12em;cursor:pointer}.enterButton:hover{background:#fff;color:#000}.particle{position:fixed;width:2px;height:2px;border-radius:50%;background:var(--accent);opacity:.3;z-index:-1;animation:float linear infinite}.cursor-dot{position:fixed;pointer-events:none;z-index:9999;display:none;transform:translate(-50%,-50%)}.cursor-dot.dot{width:7px;height:7px;border-radius:50%;background:#fff;mix-blend-mode:difference}.cursor-dot.image img{display:block;width:100%;height:100%;object-fit:contain}.reveal{opacity:0;transform:translateY(10px);transition:.55s ease}.reveal.on{opacity:1;transform:none}.heroCore.anim-fade{animation:heroFade .8s ease both}.heroCore.anim-rise{animation:heroRise .8s cubic-bezier(.2,.8,.2,1) both}.heroCore.anim-zoom{animation:heroZoom .75s cubic-bezier(.2,.8,.2,1) both}.heroCore.anim-blur{animation:heroBlur .9s ease both}
@keyframes ticker{to{transform:translateX(-50%)}}@keyframes bob{50%{transform:translate(-50%,4px)}}@keyframes float{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(var(--bgZoom))}}@keyframes bgDrift{from{transform:scale(1.03) translate3d(-1%,0,0)}to{transform:scale(1.06) translate3d(1%,1%,0)}}@keyframes badgePulse{50%{transform:scale(1.16)}}@keyframes badgeFloat{50%{transform:translateY(-3px)}}@keyframes badgeSpin{to{transform:rotate(360deg)}}@keyframes badgeGlow{50%{box-shadow:0 0 14px currentColor}}@keyframes heroFade{from{opacity:0}to{opacity:1}}@keyframes heroRise{from{opacity:0;transform:translateY(26px) scale(var(--heroScale))}to{opacity:1;transform:translateY(-1vh) scale(var(--heroScale))}}@keyframes heroZoom{from{opacity:0;transform:translateY(-1vh) scale(.88)}to{opacity:1;transform:translateY(-1vh) scale(var(--heroScale))}}@keyframes heroBlur{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@media(max-width:600px){.name{font-size:24px}.meta{left:14px;bottom:14px}.scrollCue{bottom:12px}.dots{right:12px}.more{padding-top:70px}.songCard{grid-template-columns:54px 1fr auto}.songCover{width:54px;height:54px}.waveWrap{grid-column:1/-1}.volume{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}.background video,.background .bgImage{transform:none!important}}
</style>
</head>
<body>
<script id="noxi-config" type="application/json">{"name":"jash","handle":"Known | I think","bio":"","avatar":"","backgroundVideo":"","backgroundImage":"","backgroundFit":"cover","backgroundPosition":"center center","backgroundMotion":"none","music":"","songTitle":"","songArtist":"","songAlbum":"","songCover":"","scrollText":"","accent":"#ffffff","text":"#ffffff","boxColor":"rgba(8,8,8,.58)","borderColor":"rgba(255,255,255,.15)","radius":18,"blur":16,"overlay":42,"glow":20,"cardWidth":760,"particles":false,"customCursor":true,"cursorImage":"","cursorSize":32,"tilt":false,"waveform":true,"showEnter":true,"footer":"","heroAnimation":"rise","badges":[{"text":"♨","title":"badge","color":"#ffffff","bg":"rgba(255,255,255,.10)","border":"rgba(255,255,255,.12)","animation":"none"}],"links":[{"title":"GitHub","url":"https://github.com/jash-sudo"}],"boxes":[],"location":"California","views":"158","scrollCue":"Scroll for more"}</script>
<div class="background" id="background"><div class="bgImage" id="bgImage"></div><video id="bgVideo" muted loop playsinline preload="auto"></video></div><div class="shade"></div><div class="noise"></div><div class="cursor-dot" id="cursor"><img id="cursorImg" alt=""></div>
<button class="sound" id="soundButton" type="button" aria-label="Toggle sound">🔊</button><div id="enter"><button class="enterButton" id="enterButton">enter</button></div>
<section class="hero snap" id="top"><div class="ticker" id="ticker"><span></span></div><div class="heroCore reveal" id="heroCore"><img class="avatar" id="avatar" alt="profile"><div class="identity"><div class="name" id="name"></div><div class="badges" id="badges"></div></div><div class="handle" id="handle"></div><div class="bio" id="bio"></div><div class="heroLinks" id="heroLinks"></div></div><div class="meta"><span id="views"></span><span id="location"></span></div><a class="scrollCue" href="#more"><span id="scrollCue"></span><b>↓</b></a><div class="dots" aria-hidden="true"><i class="active"></i><i></i></div></section>
<section class="more snap" id="more"><div class="content"><section class="songCard reveal" id="songCard"><img class="songCover" id="songCover" alt="song cover"><div><div class="songTitle" id="songTitle"></div><div class="songArtist" id="songArtist"></div><div class="songAlbum" id="songAlbum"></div></div><div class="songControls"><button type="button" id="musicButton">▶</button><input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.75"></div><div class="waveWrap"><div class="wave" id="wave"></div><div class="time" id="time">0:00 / 0:00</div></div></section><div class="stack" id="boxes"></div><div class="links" id="links"></div><div class="footer" id="footer"></div></div></section>
<audio id="audio" loop preload="metadata"></audio>
<script>
const cfg=JSON.parse(document.getElementById('noxi-config').textContent),$=id=>document.getElementById(id),root=document.documentElement;
root.style.setProperty('--accent',cfg.accent||'#fff');root.style.setProperty('--text',cfg.text||'#fff');root.style.setProperty('--box',cfg.boxColor||'rgba(8,8,8,.58)');root.style.setProperty('--border',cfg.borderColor||'rgba(255,255,255,.15)');root.style.setProperty('--radius',Math.max(0,Number(cfg.radius)||0)+'px');root.style.setProperty('--blur',Math.max(0,Number(cfg.blur)||0)+'px');root.style.setProperty('--overlay',Math.max(0,Math.min(100,Number(cfg.overlay??42)))/100);root.style.setProperty('--glow',Math.max(0,Number(cfg.glow)||0)+'px');root.style.setProperty('--cardWidth',Math.max(320,Math.min(1100,Number(cfg.cardWidth)||760))+'px');
document.title=cfg.name||'profile';$('name').textContent=cfg.name||'';$('handle').textContent=cfg.handle||'';$('bio').textContent=cfg.bio||'';$('footer').textContent=cfg.footer||'';$('views').textContent=cfg.views?`◉ ${cfg.views}`:'';$('location').textContent=cfg.location?`⌖ ${cfg.location}`:'';$('scrollCue').textContent=cfg.scrollCue||'Scroll for more';
const heroCore=$('heroCore');if(['fade','rise','zoom','blur'].includes(cfg.heroAnimation))heroCore.classList.add('anim-'+cfg.heroAnimation);
const avatar=$('avatar');if(cfg.avatar)avatar.src=cfg.avatar;else avatar.style.display='none';
const background=$('background'),bg=$('bgImage'),video=$('bgVideo');background.dataset.motion=['none','slowzoom','drift'].includes(cfg.backgroundMotion)?cfg.backgroundMotion:'none';const fit=['cover','contain'].includes(cfg.backgroundFit)?cfg.backgroundFit:'cover',pos=cfg.backgroundPosition||'center center';bg.style.backgroundSize=fit;bg.style.backgroundPosition=pos;video.style.objectFit=fit;video.style.objectPosition=pos;
if(cfg.backgroundImage){bg.style.backgroundImage=`url("${String(cfg.backgroundImage).replace(/"/g,'%22')}")`}else bg.style.display='none';
if(cfg.backgroundVideo){video.src=cfg.backgroundVideo;video.load();const tryVideo=()=>video.play().catch(()=>{});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tryVideo,{once:true});else tryVideo();video.addEventListener('canplay',tryVideo,{once:true});video.addEventListener('error',()=>{video.style.display='none';bg.style.display='block'})}else video.style.display='none';
const tickerText=(cfg.scrollText||'').trim();if(tickerText)$('ticker').querySelector('span').textContent=(tickerText+'     •     ').repeat(12);else $('ticker').style.display='none';
const normalizeBadge=x=>typeof x==='string'?{text:x}:x||{};(cfg.badges||[]).slice(0,12).map(normalizeBadge).forEach(x=>{const b=document.createElement('span');b.className='badge';b.textContent=x.text||'•';if(x.title)b.title=x.title;if(x.color)b.style.setProperty('--badge-color',x.color);if(x.bg)b.style.setProperty('--badge-bg',x.bg);if(x.border)b.style.setProperty('--badge-border',x.border);if(['pulse','float','spin','glow'].includes(x.animation))b.classList.add('anim-'+x.animation);$('badges').append(b)});if(!(cfg.badges||[]).length)$('badges').style.display='none';
function iconFor(title){const t=(title||'').toLowerCase();if(t.includes('github'))return'◉';if(t.includes('roblox'))return'◇';if(t.includes('discord'))return'◌';if(t.includes('youtube'))return'▶';if(t.includes('spotify'))return'♫';if(t.includes('instagram'))return'◎';return'↗'}(cfg.links||[]).forEach(l=>{if(!l.url)return;const a=document.createElement('a');a.className='heroLink';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.title=l.title||l.url;a.textContent=iconFor(l.title);$('heroLinks').append(a);const x=document.createElement('a');x.className='link reveal';x.href=l.url;x.target='_blank';x.rel='noopener noreferrer';x.textContent=l.title||l.url;$('links').append(x)});if(!(cfg.links||[]).length)$('heroLinks').style.display='none';
(cfg.boxes||[]).forEach(b=>{const el=document.createElement('section');el.className='box reveal';const h=document.createElement('h2');h.textContent=b.title||'';const p=document.createElement('p');p.textContent=b.body||'';el.append(h,p);$('boxes').append(el)});
const audio=$('audio'),card=$('songCard'),btn=$('musicButton'),cover=$('songCover'),vol=$('volume'),time=$('time'),wave=$('wave');$('songTitle').textContent=cfg.songTitle||'untitled';$('songArtist').textContent=cfg.songArtist||'';$('songAlbum').textContent=cfg.songAlbum||'';if(cfg.songCover)cover.src=cfg.songCover;else cover.style.visibility='hidden';if(cfg.music)audio.src=cfg.music;else card.style.display='none';for(let i=0;i<48;i++){const bar=document.createElement('i');bar.style.height=(18+Math.random()*52)+'%';wave.append(bar)}if(cfg.waveform===false)wave.parentElement.style.display='none';
let analyser=null,data=null,audioCtx=null;function initViz(){if(analyser||!cfg.music)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const src=audioCtx.createMediaElementSource(audio);analyser=audioCtx.createAnalyser();analyser.fftSize=128;src.connect(analyser);analyser.connect(audioCtx.destination);data=new Uint8Array(analyser.frequencyBinCount);requestAnimationFrame(drawWave)}catch{}}function drawWave(){if(!analyser)return;analyser.getByteFrequencyData(data);[...wave.children].forEach((b,i)=>{const v=data[Math.floor(i*data.length/wave.children.length)]||0;b.style.height=(12+v/255*88)+'%'});requestAnimationFrame(drawWave)}function fmt(s){if(!Number.isFinite(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}function syncTime(){time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)}audio.addEventListener('timeupdate',syncTime);audio.addEventListener('loadedmetadata',syncTime);vol.addEventListener('input',()=>audio.volume=Number(vol.value));audio.volume=.75;async function toggleMusic(){if(!cfg.music)return;initViz();if(audioCtx?.state==='suspended')await audioCtx.resume();if(audio.paused){await audio.play().catch(()=>{});btn.textContent='❚❚';$('soundButton').textContent='🔊'}else{audio.pause();btn.textContent='▶';$('soundButton').textContent='🔇'}}btn.addEventListener('click',toggleMusic);$('soundButton').addEventListener('click',toggleMusic);
const enter=$('enter');if(cfg.showEnter===false)enter.remove();else $('enterButton').addEventListener('click',async()=>{enter.style.opacity='0';setTimeout(()=>enter.remove(),350);video.play().catch(()=>{});if(cfg.music)await toggleMusic()});
if(cfg.particles&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<28;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(8+Math.random()*18)+'s';p.style.animationDelay=(-Math.random()*20)+'s';p.style.opacity=.08+Math.random()*.32;document.body.append(p)}}
const cur=$('cursor');if(cfg.customCursor&&matchMedia('(pointer:fine)').matches){cur.style.display='block';if(cfg.cursorImage){cur.classList.add('image');cur.style.width=cur.style.height=Math.max(8,Math.min(128,Number(cfg.cursorSize)||32))+'px';$('cursorImg').src=cfg.cursorImage}else{cur.classList.add('dot');$('cursorImg').style.display='none'}addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'})}
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(x=>obs.observe(x));if(cfg.tilt&&matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;heroCore.style.transform=`translateY(-1vh) translate(${x*3}px,${y*3}px)`})}
const sections=[...document.querySelectorAll('.snap')],dots=[...document.querySelectorAll('.dots i')];const sectionObs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=sections.indexOf(e.target);dots.forEach((d,n)=>d.classList.toggle('active',n===i))}}),{threshold:.6});sections.forEach(s=>sectionObs.observe(s));
</script>
