<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jash</title>
<style>
:root{--accent:#fff;--text:#fff;--muted:#aaa;--box:rgba(0,0,0,.58);--border:rgba(255,255,255,.16);--radius:18px;--blur:16px;--overlay:.42;--glow:24px;--cardWidth:760px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit}
#bgVideo,.bgImage{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-5}.bgImage{background-size:cover;background-position:center}.shade{position:fixed;inset:0;background:rgba(0,0,0,var(--overlay));z-index:-4}.noise{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}.ticker{position:relative;overflow:hidden;border-bottom:1px solid var(--border);background:rgba(0,0,0,.22);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.ticker span{display:inline-block;padding:12px 0;animation:ticker 18s linear infinite}@keyframes ticker{to{transform:translateX(-50%)}}
main{width:min(var(--cardWidth),calc(100% - 28px));margin:0 auto;padding:72px 0 100px}.profile{text-align:center;margin-bottom:28px}.avatar{width:102px;height:102px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:#111;box-shadow:0 0 var(--glow) color-mix(in srgb,var(--accent) 28%,transparent)}.name{font-size:36px;font-weight:500;letter-spacing:-.03em;margin:16px 0 4px;text-shadow:0 0 var(--glow) color-mix(in srgb,var(--accent) 50%,transparent)}.handle{font-size:12px;color:var(--muted);margin-bottom:15px}.bio{max-width:560px;margin:0 auto;color:#ddd;line-height:1.65;font-size:14px;white-space:pre-wrap}.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}.badge{font-size:10px;padding:5px 8px;border:1px solid var(--border);border-radius:999px;background:var(--box);backdrop-filter:blur(var(--blur))}.stack{display:grid;gap:12px}.box,.link,.songCard{background:var(--box);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));transition:transform .2s ease,border-color .2s ease,background .2s ease}.box{padding:20px}.box h2{font-size:13px;margin:0 0 9px;font-weight:500}.box p{margin:0;color:#bbb;font-size:13px;line-height:1.6;white-space:pre-wrap}.links{display:grid;gap:10px}.link{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;font-size:13px}.link:after{content:'↗';color:var(--muted)}.link:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:rgba(0,0,0,.72)}
.songCard{margin:0 auto 18px;padding:14px;display:grid;grid-template-columns:66px 1fr auto;align-items:center;gap:13px;text-align:left}.songCover{width:66px;height:66px;object-fit:cover;border-radius:calc(var(--radius) * .62);background:#111}.songInfo{min-width:0}.songTitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.songArtist,.songAlbum{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.songControls{display:flex;align-items:center;gap:8px}.songControls button{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:rgba(0,0,0,.35);color:#fff;cursor:pointer}.waveWrap{grid-column:2/4;display:flex;align-items:center;gap:9px}.wave{height:34px;display:flex;align-items:center;gap:2px;flex:1;overflow:hidden}.wave i{display:block;flex:1;min-width:2px;max-width:5px;height:20%;border-radius:3px;background:color-mix(in srgb,var(--accent) 72%,#555);transform-origin:center;transition:height .08s linear}.time{font-size:10px;color:var(--muted);min-width:70px;text-align:right}.volume{width:74px;accent-color:var(--accent)}
#enter{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;transition:opacity .35s ease}.enterButton{border:1px solid #282828;background:#050505;color:#fff;padding:13px 22px;font:inherit;font-size:12px;letter-spacing:.1em;cursor:pointer}.enterButton:hover{background:#fff;color:#000}.particle{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.35;z-index:-1;animation:float linear infinite}@keyframes float{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}.cursor-dot{position:fixed;pointer-events:none;z-index:9999;display:none;transform:translate(-50%,-50%);will-change:left,top}.cursor-dot.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);mix-blend-mode:difference}.cursor-dot.image img{display:block;width:100%;height:100%;object-fit:contain}.reveal{opacity:0;transform:translateY(12px);transition:.55s ease}.reveal.on{opacity:1;transform:none}.footer{text-align:center;color:#555;font-size:10px;margin-top:28px}
@media(max-width:600px){main{padding-top:52px}.name{font-size:30px}.box{padding:17px}.songCard{grid-template-columns:54px 1fr auto}.songCover{width:54px;height:54px}.waveWrap{grid-column:1/-1}.volume{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<script id="noxi-config" type="application/json">{"name":"jash","handle":"@jash","bio":"","avatar":"","backgroundVideo":"","backgroundImage":"","music":"","songTitle":"","songArtist":"","songAlbum":"","songCover":"","scrollText":"noxi.lol/jash","accent":"#ffffff","text":"#ffffff","boxColor":"rgba(0,0,0,.58)","borderColor":"rgba(255,255,255,.16)","radius":18,"blur":16,"overlay":42,"glow":24,"cardWidth":760,"particles":true,"customCursor":true,"cursorImage":"","cursorSize":32,"tilt":true,"waveform":true,"showEnter":true,"footer":"","badges":[],"links":[{"title":"GitHub","url":"https://github.com/jash-sudo"}],"boxes":[{"title":"about","body":"edit me in editor.html"}]}</script>
<div class="bgImage" id="bgImage"></div><video id="bgVideo" muted loop playsinline></video><div class="shade"></div><div class="noise"></div><div class="cursor-dot" id="cursor"><img id="cursorImg" alt=""></div>
<div class="ticker" id="ticker"><span></span></div>
<div id="enter"><button class="enterButton" id="enterButton">enter</button></div>
<main>
<section class="profile reveal"><img class="avatar" id="avatar" alt="profile"><div class="name" id="name"></div><div class="handle" id="handle"></div><div class="bio" id="bio"></div><div class="badges" id="badges"></div></section>
<section class="songCard reveal" id="songCard"><img class="songCover" id="songCover" alt="song cover"><div class="songInfo"><div class="songTitle" id="songTitle"></div><div class="songArtist" id="songArtist"></div><div class="songAlbum" id="songAlbum"></div></div><div class="songControls"><button type="button" id="musicButton" aria-label="Play or pause">▶</button><input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Volume"></div><div class="waveWrap"><div class="wave" id="wave" aria-hidden="true"></div><div class="time" id="time">0:00 / 0:00</div></div></section>
<div class="stack" id="boxes"></div><div style="height:12px"></div><div class="links reveal" id="links"></div><div class="footer" id="footer"></div>
</main>
<audio id="audio" loop preload="metadata"></audio>
<script>
const cfg=JSON.parse(document.getElementById('noxi-config').textContent);const $=id=>document.getElementById(id);const root=document.documentElement;
root.style.setProperty('--accent',cfg.accent||'#fff');root.style.setProperty('--text',cfg.text||'#fff');root.style.setProperty('--box',cfg.boxColor||'rgba(0,0,0,.58)');root.style.setProperty('--border',cfg.borderColor||'rgba(255,255,255,.16)');root.style.setProperty('--radius',Math.max(0,Number(cfg.radius)||0)+'px');root.style.setProperty('--blur',Math.max(0,Number(cfg.blur)||0)+'px');root.style.setProperty('--overlay',Math.max(0,Math.min(100,Number(cfg.overlay??42)))/100);root.style.setProperty('--glow',Math.max(0,Number(cfg.glow)||0)+'px');root.style.setProperty('--cardWidth',Math.max(320,Math.min(1100,Number(cfg.cardWidth)||760))+'px');
document.title=cfg.name||'profile';$('name').textContent=cfg.name||'';$('handle').textContent=cfg.handle||'';$('bio').textContent=cfg.bio||'';$('footer').textContent=cfg.footer||'';
const avatar=$('avatar');if(cfg.avatar)avatar.src=cfg.avatar;else avatar.style.display='none';const bg=$('bgImage');if(cfg.backgroundImage)bg.style.backgroundImage=`url("${String(cfg.backgroundImage).replace(/"/g,'%22')}")`;const video=$('bgVideo');if(cfg.backgroundVideo){video.src=cfg.backgroundVideo;video.play().catch(()=>{})}else video.style.display='none';
const tickerText=(cfg.scrollText||'').trim(),ticker=$('ticker');if(tickerText)ticker.querySelector('span').textContent=(tickerText+'     •     ').repeat(12);else ticker.style.display='none';
(cfg.badges||[]).forEach(x=>{const b=document.createElement('span');b.className='badge';b.textContent=x;$('badges').append(b)});if(!(cfg.badges||[]).length)$('badges').style.display='none';
(cfg.boxes||[]).forEach(b=>{const el=document.createElement('section');el.className='box reveal';const h=document.createElement('h2');h.textContent=b.title||'';const p=document.createElement('p');p.textContent=b.body||'';el.append(h,p);$('boxes').append(el)});(cfg.links||[]).forEach(l=>{if(!l.url)return;const a=document.createElement('a');a.className='link';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=l.title||l.url;$('links').append(a)});
const audio=$('audio'),card=$('songCard'),btn=$('musicButton'),cover=$('songCover'),vol=$('volume'),time=$('time'),wave=$('wave');$('songTitle').textContent=cfg.songTitle||'untitled';$('songArtist').textContent=cfg.songArtist||'';$('songAlbum').textContent=cfg.songAlbum||'';if(cfg.songCover)cover.src=cfg.songCover;else cover.style.visibility='hidden';if(cfg.music)audio.src=cfg.music;else card.style.display='none';for(let i=0;i<48;i++){const bar=document.createElement('i');bar.style.height=(18+Math.random()*54)+'%';wave.append(bar)}if(cfg.waveform===false)wave.parentElement.style.display='none';
let analyser=null,data=null,audioCtx=null;function initAudioViz(){if(analyser||!cfg.music)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const src=audioCtx.createMediaElementSource(audio);analyser=audioCtx.createAnalyser();analyser.fftSize=128;src.connect(analyser);analyser.connect(audioCtx.destination);data=new Uint8Array(analyser.frequencyBinCount);animateWave()}catch{}}
function animateWave(){if(!analyser)return;analyser.getByteFrequencyData(data);const bars=wave.children;for(let i=0;i<bars.length;i++){const v=data[Math.floor(i*data.length/bars.length)]||0;bars[i].style.height=(12+(v/255)*88)+'%'}requestAnimationFrame(animateWave)}function fmt(s){if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')}function syncTime(){time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)}audio.addEventListener('timeupdate',syncTime);audio.addEventListener('loadedmetadata',syncTime);vol.addEventListener('input',()=>audio.volume=Number(vol.value));audio.volume=Number(vol.value);
async function toggleMusic(){if(!cfg.music)return;initAudioViz();if(audioCtx?.state==='suspended')await audioCtx.resume();if(audio.paused){await audio.play().catch(()=>{});btn.textContent='❚❚'}else{audio.pause();btn.textContent='▶'}}btn.addEventListener('click',toggleMusic);
const enter=$('enter');if(cfg.showEnter===false)enter.remove();else $('enterButton').addEventListener('click',async()=>{enter.style.opacity='0';setTimeout(()=>enter.remove(),350);if(cfg.music)await toggleMusic()});
if(cfg.particles&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<28;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(8+Math.random()*18)+'s';p.style.animationDelay=(-Math.random()*20)+'s';p.style.opacity=.08+Math.random()*.32;document.body.append(p)}}
const cur=$('cursor');if(cfg.customCursor&&matchMedia('(pointer:fine)').matches){cur.style.display='block';if(cfg.cursorImage){cur.classList.add('image');cur.style.width=cur.style.height=Math.max(8,Math.min(128,Number(cfg.cursorSize)||32))+'px';$('cursorImg').src=cfg.cursorImage}else{cur.classList.add('dot');$('cursorImg').style.display='none'}addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'})}
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(x=>obs.observe(x));if(cfg.tilt&&matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;document.querySelectorAll('.box').forEach((b,i)=>b.style.transform=`translate(${x*(2+i*.12)}px,${y*(2+i*.12)}px)`)})}
</script>
</body>
</html>
