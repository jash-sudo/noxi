<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jash</title>
<style>
:root{--accent:#fff;--text:#fff;--muted:#aaa;--box:rgba(0,0,0,.58);--border:rgba(255,255,255,.16);--radius:18px;--blur:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}#bgVideo,.bgImage{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4}.bgImage{background-size:cover;background-position:center}.shade{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:-3}.noise{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}.ticker{position:relative;overflow:hidden;border-bottom:1px solid var(--border);background:rgba(0,0,0,.25);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.ticker span{display:inline-block;padding:12px 0;animation:ticker 18s linear infinite}@keyframes ticker{to{transform:translateX(-50%)}}main{width:min(760px,calc(100% - 28px));margin:0 auto;padding:78px 0 100px}.profile{text-align:center;margin-bottom:28px}.avatar{width:98px;height:98px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:#111}.name{font-size:34px;font-weight:500;letter-spacing:-.03em;margin:16px 0 4px;text-shadow:0 0 28px color-mix(in srgb,var(--accent) 38%,transparent)}.handle{font-size:12px;color:var(--muted);margin-bottom:15px}.bio{max-width:560px;margin:0 auto;color:#ddd;line-height:1.65;font-size:14px;white-space:pre-wrap}.stack{display:grid;gap:12px}.box,.link{background:var(--box);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));transition:transform .2s ease,border-color .2s ease,background .2s ease}.box{padding:20px}.box h2{font-size:13px;margin:0 0 9px;font-weight:500}.box p{margin:0;color:#bbb;font-size:13px;line-height:1.6;white-space:pre-wrap}.links{display:grid;gap:10px}.link{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;font-size:13px}.link:after{content:'↗';color:var(--muted)}.link:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:rgba(0,0,0,.72)}.music{margin:18px auto 0;display:flex;align-items:center;justify-content:center;gap:10px}.music button{border:1px solid var(--border);background:var(--box);color:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.music span{font-size:11px;color:var(--muted)}#enter{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;transition:opacity .35s ease}.enterButton{border:1px solid #282828;background:#050505;color:#fff;padding:13px 22px;font:inherit;font-size:12px;letter-spacing:.1em;cursor:pointer}.enterButton:hover{background:#fff;color:#000}.particle{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.35;z-index:-1;animation:float linear infinite}@keyframes float{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}.cursor-dot{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:999;transform:translate(-50%,-50%);mix-blend-mode:difference;display:none}.reveal{opacity:0;transform:translateY(12px);transition:.55s ease}.reveal.on{opacity:1;transform:none}@media(max-width:600px){main{padding-top:52px}.name{font-size:29px}.box{padding:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<script id="noxi-config" type="application/json">{"name":"jash","handle":"@jash","bio":"","avatar":"","backgroundVideo":"","backgroundImage":"","music":"","songLabel":"","scrollText":"noxi.lol/jash","accent":"#ffffff","text":"#ffffff","boxColor":"rgba(0,0,0,.58)","borderColor":"rgba(255,255,255,.16)","radius":18,"blur":16,"particles":true,"customCursor":true,"tilt":true,"links":[{"title":"GitHub","url":"https://github.com/jash-sudo"}],"boxes":[{"title":"about","body":"edit me in editor.html"}]}</script>
<div class="bgImage" id="bgImage"></div><video id="bgVideo" muted loop playsinline></video><div class="shade"></div><div class="noise"></div><div class="cursor-dot" id="cursor"></div>
<div class="ticker" id="ticker"><span></span></div>
<div id="enter"><button class="enterButton" id="enterButton">enter</button></div>
<main><section class="profile reveal"><img class="avatar" id="avatar" alt="profile"><div class="name" id="name"></div><div class="handle" id="handle"></div><div class="bio" id="bio"></div><div class="music" id="musicWrap"><button type="button" id="musicButton">play</button><span id="songLabel"></span></div></section><div class="stack" id="boxes"></div><div style="height:12px"></div><div class="links reveal" id="links"></div></main>
<audio id="audio" loop preload="metadata"></audio>
<script>
const cfg=JSON.parse(document.getElementById('noxi-config').textContent);
const root=document.documentElement;root.style.setProperty('--accent',cfg.accent||'#fff');root.style.setProperty('--text',cfg.text||'#fff');root.style.setProperty('--box',cfg.boxColor||'rgba(0,0,0,.58)');root.style.setProperty('--border',cfg.borderColor||'rgba(255,255,255,.16)');root.style.setProperty('--radius',(Number(cfg.radius)||0)+'px');root.style.setProperty('--blur',(Number(cfg.blur)||0)+'px');
document.title=cfg.name||'profile';document.getElementById('name').textContent=cfg.name||'';document.getElementById('handle').textContent=cfg.handle||'';document.getElementById('bio').textContent=cfg.bio||'';
const avatar=document.getElementById('avatar');if(cfg.avatar){avatar.src=cfg.avatar}else{avatar.style.display='none'}
const img=document.getElementById('bgImage');if(cfg.backgroundImage)img.style.backgroundImage=`url("${String(cfg.backgroundImage).replace(/"/g,'%22')}")`;
const video=document.getElementById('bgVideo');if(cfg.backgroundVideo){video.src=cfg.backgroundVideo;video.play().catch(()=>{})}else video.style.display='none';
const tickerText=(cfg.scrollText||'').trim();const ticker=document.getElementById('ticker');if(tickerText){ticker.querySelector('span').textContent=(tickerText+'     •     ').repeat(12)}else ticker.style.display='none';
const boxes=document.getElementById('boxes');(cfg.boxes||[]).forEach(b=>{const el=document.createElement('section');el.className='box reveal';const h=document.createElement('h2');h.textContent=b.title||'';const p=document.createElement('p');p.textContent=b.body||'';el.append(h,p);boxes.append(el)});
const links=document.getElementById('links');(cfg.links||[]).forEach(l=>{if(!l.url)return;const a=document.createElement('a');a.className='link';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=l.title||l.url;links.append(a)});
const audio=document.getElementById('audio'),musicWrap=document.getElementById('musicWrap'),musicButton=document.getElementById('musicButton'),songLabel=document.getElementById('songLabel');songLabel.textContent=cfg.songLabel||'';if(cfg.music){audio.src=cfg.music}else musicWrap.style.display='none';
function toggleMusic(){if(!cfg.music)return;if(audio.paused){audio.play().then(()=>musicButton.textContent='pause').catch(()=>{})}else{audio.pause();musicButton.textContent='play'}}musicButton.addEventListener('click',toggleMusic);
const enter=document.getElementById('enter');document.getElementById('enterButton').addEventListener('click',()=>{enter.style.opacity='0';setTimeout(()=>enter.remove(),350);if(cfg.music)audio.play().then(()=>musicButton.textContent='pause').catch(()=>{})});
if(cfg.particles&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<28;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(8+Math.random()*18)+'s';p.style.animationDelay=(-Math.random()*20)+'s';p.style.opacity=(.08+Math.random()*.32);document.body.append(p)}}
const cur=document.getElementById('cursor');if(cfg.customCursor&&matchMedia('(pointer:fine)').matches){cur.style.display='block';addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'})}
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(x=>obs.observe(x));
if(cfg.tilt&&matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;document.querySelectorAll('.box').forEach((b,i)=>b.style.transform=`translate(${x*(2+i*.15)}px,${y*(2+i*.15)}px)`)})}
</script>
</body>
</html>
